document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'IBM Plex Mono';\n  font-style: normal;\n  font-weight: 600;\n  font-display: swap;\n  src: url(\"aaaee617-df39-4b3e-b0ef-9c620ba3aa1b\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n<\u002Fstyle>\n<style>\n  *{box-sizing:border-box}\n  html,body{margin:0;height:100%;background:#04090f;overflow:hidden;}\n  ::selection{background:rgba(255,90,79,0.3);color:#fff}\n  .bp-scroll::-webkit-scrollbar{width:6px}\n  .bp-scroll::-webkit-scrollbar-thumb{background:rgba(86,207,225,0.18);border-radius:3px}\n  .bp-scroll::-webkit-scrollbar-track{background:transparent}\n  @keyframes bp-fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}\n<\u002Fstyle>\n<script src=\"06e01aaa-170b-4419-a03e-a5da3031da49\"><\u002Fscript>\n<script src=\"21eda1a4-7cca-47c2-a76a-cb94eb14eb58\"><\u002Fscript>\n<script src=\"0eff353e-29ee-4076-88f3-2e66a597a05a\"><\u002Fscript>\n<script src=\"7437e098-afbb-4e68-8258-93a28c5429e4\"><\u002Fscript>\n<\u002Fhelmet>\n\n<div style=\"position:fixed;inset:0;background:radial-gradient(130% 130% at 55% 44%, #081420 0%, #050d15 48%, #03070c 100%);color:#d7e3ee;font-family:'IBM Plex Mono',monospace;overflow:hidden;\">\n\n  <canvas ref=\"{{ canvasRef }}\" onpointerdown=\"{{ onCanvasDown }}\" onwheel=\"{{ onWheel }}\" style=\"position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;\"><\u002Fcanvas>\n\n  <!-- top brand -->\n  <div style=\"position:absolute;top:22px;left:28px;z-index:5;pointer-events:none;\">\n    <div style=\"font-family:'Cormorant Garamond',serif;font-weight:600;font-size:30px;letter-spacing:0.16em;line-height:1;color:#f2e7df;\">BLOOD &amp; EMPIRE<\u002Fdiv>\n    <div style=\"margin-top:8px;font-size:10.5px;letter-spacing:0.24em;color:#6b8092;text-transform:uppercase;\">War Across the Ancient World · 401 BCE–100 CE<\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- toll module -->\n  <div style=\"position:absolute;top:20px;left:50%;transform:translateX(-50%);z-index:5;text-align:center;pointer-events:none;\">\n    <div style=\"font-size:9.5px;letter-spacing:0.34em;color:#6b8092;text-transform:uppercase;\">Estimated dead — cumulative<\u002Fdiv>\n    <div style=\"display:flex;align-items:baseline;justify-content:center;gap:10px;margin-top:2px;\">\n      <span ref=\"{{ tollRef }}\" style=\"font-family:'Cormorant Garamond',serif;font-weight:600;font-size:54px;line-height:1;color:#ff5a4f;text-shadow:0 0 26px rgba(255,90,79,0.35);\">0<\u002Fspan>\n    <\u002Fdiv>\n    <div style=\"margin-top:4px;font-size:11px;letter-spacing:0.22em;color:#9fb3c2;\"><span ref=\"{{ yearRef }}\">401 BCE<\u002Fspan><\u002Fdiv>\n    <div style=\"margin-top:5px;font-size:9px;letter-spacing:0.16em;color:#5f7384;text-transform:uppercase;\"><span ref=\"{{ statRef }}\">0 battles<\u002Fspan><\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- hint -->\n  <div style=\"position:absolute;top:26px;right:28px;z-index:5;text-align:right;pointer-events:none;font-size:9.5px;letter-spacing:0.18em;color:#52677a;text-transform:uppercase;line-height:1.9;\">\n    Drag to rotate<br>Scroll to zoom<br>Click a battle\n  <\u002Fdiv>\n\n  <!-- era chapter rail (data story) -->\n  <div style=\"position:absolute;left:28px;top:118px;bottom:150px;width:300px;z-index:5;display:flex;flex-direction:column;\">\n    <div style=\"font-size:9.5px;letter-spacing:0.3em;color:#6b8092;text-transform:uppercase;margin-bottom:12px;padding-left:2px;\">The Ages of War<\u002Fdiv>\n    <div ref=\"{{ railRef }}\" class=\"bp-scroll\" style=\"flex:1;overflow-y:auto;padding-right:6px;display:flex;flex-direction:column;gap:9px;\">\n      <sc-for list=\"{{ eras }}\" as=\"era\" hint-placeholder-count=\"7\">\n        <div onclick=\"{{ era.onClick }}\" style=\"{{ era.cardStyle }}\">\n          <div style=\"display:flex;align-items:baseline;justify-content:space-between;gap:8px;\">\n            <span style=\"font-family:'Cormorant Garamond',serif;font-size:20px;font-weight:600;color:{{ era.titleColor }};line-height:1.05;\">{{ era.title }}<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"font-size:9px;letter-spacing:0.16em;color:#5f7384;margin-top:3px;text-transform:uppercase;\">{{ era.yearsLabel }}<\u002Fdiv>\n          <div style=\"font-size:11.5px;line-height:1.5;color:#9db0bf;margin-top:8px;font-family:'IBM Plex Mono',monospace;\">{{ era.blurb }}<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- detail panel (pinned battle) -->\n  <sc-if value=\"{{ pinned }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"position:absolute;right:28px;top:118px;width:288px;z-index:6;background:rgba(8,17,25,0.82);border:1px solid rgba(255,90,79,0.22);border-radius:12px;padding:18px 18px 16px;backdrop-filter:blur(10px);animation:bp-fade 0.25s ease;\">\n      <div style=\"display:flex;justify-content:space-between;align-items:flex-start;gap:10px;\">\n        <div>\n          <div style=\"font-size:9px;letter-spacing:0.22em;color:#ff5a4f;text-transform:uppercase;\">{{ pinned.eraLabel }}<\u002Fdiv>\n          <div style=\"font-family:'Cormorant Garamond',serif;font-size:23px;font-weight:600;color:#f2e7df;line-height:1.08;margin-top:4px;\">{{ pinned.name }}<\u002Fdiv>\n        <\u002Fdiv>\n        <div onclick=\"{{ onClearPin }}\" style=\"cursor:pointer;font-size:15px;color:#6b8092;line-height:1;padding:2px 4px;\">×<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:flex;gap:22px;margin-top:16px;\">\n        <div>\n          <div style=\"font-size:9px;letter-spacing:0.18em;color:#5f7384;text-transform:uppercase;\">Year<\u002Fdiv>\n          <div style=\"font-size:16px;color:#d7e3ee;margin-top:3px;\">{{ pinned.dateLabel }}<\u002Fdiv>\n        <\u002Fdiv>\n        <div>\n          <div style=\"font-size:9px;letter-spacing:0.18em;color:#5f7384;text-transform:uppercase;\">Estimated dead<\u002Fdiv>\n          <div style=\"font-size:16px;color:{{ pinned.deathsColor }};margin-top:3px;\">{{ pinned.deathsFmt }}<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <sc-if value=\"{{ pinned.uncounted }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"margin-top:14px;padding-top:12px;border-top:1px solid rgba(255,255,255,0.08);font-size:10px;line-height:1.55;color:#7d92a2;letter-spacing:0.02em;\">No casualty figure survives for this battle. It was fought — the dead were never counted.<\u002Fdiv>\n      <\u002Fsc-if>\n      <sc-if value=\"{{ pinned.hasMap }}\" hint-placeholder-val=\"{{ false }}\">\n        <div onclick=\"{{ pinned.onMap }}\" style=\"cursor:pointer;margin-top:15px;padding:11px 13px;border-radius:9px;border:1px solid rgba(86,207,225,0.4);background:rgba(86,207,225,0.09);display:flex;align-items:center;gap:9px;transition:all .15s;\" style-hover=\"background:rgba(86,207,225,0.18);\">\n          <span style=\"font-size:15px;color:#7fd6e8;\">▸<\u002Fspan>\n          <span style=\"font-size:11px;letter-spacing:0.06em;color:#aee3ef;line-height:1.35;\">View battle map<br><span style=\"color:#6b8092;font-size:9.5px;letter-spacing:0.1em;text-transform:uppercase;\">see how the armies moved<\u002Fspan><\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <!-- battle map modal -->\n  <sc-if value=\"{{ mapModal }}\" hint-placeholder-val=\"{{ false }}\">\n    <div onclick=\"{{ onCloseMap }}\" style=\"position:fixed;inset:0;z-index:20;background:rgba(3,7,12,0.74);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;animation:bp-fade 0.22s ease;\">\n      <div onclick=\"{{ stop }}\" style=\"width:min(760px,92vw);background:#081019;border:1px solid rgba(86,207,225,0.22);border-radius:16px;box-shadow:0 30px 90px rgba(0,0,0,0.6);overflow:hidden;\">\n        <div style=\"display:flex;justify-content:space-between;align-items:flex-start;padding:18px 22px 12px;\">\n          <div>\n            <div style=\"font-size:9px;letter-spacing:0.24em;color:#ff5a4f;text-transform:uppercase;\">Battle map · {{ mapModal.dateLabel }}<\u002Fdiv>\n            <div style=\"font-family:'Cormorant Garamond',serif;font-size:27px;font-weight:600;color:#f2e7df;line-height:1.05;margin-top:3px;\">{{ mapModal.title }}<\u002Fdiv>\n          <\u002Fdiv>\n          <div onclick=\"{{ onCloseMap }}\" style=\"cursor:pointer;font-size:20px;color:#6b8092;line-height:1;padding:2px 6px;\">×<\u002Fdiv>\n        <\u002Fdiv>\n        <canvas ref=\"{{ mapCanvasRef }}\" style=\"display:block;width:100%;height:min(46vh,420px);background:#0a1822;\"><\u002Fcanvas>\n        <div style=\"display:flex;gap:18px;flex-wrap:wrap;padding:13px 22px 4px;\">\n          <sc-for list=\"{{ mapModal.sides }}\" as=\"sd\" hint-placeholder-count=\"2\">\n            <div style=\"display:flex;align-items:center;gap:7px;font-size:11px;color:#cdd9e2;letter-spacing:0.03em;\"><span style=\"{{ sd.swatch }}\"><\u002Fspan>{{ sd.name }}<\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <div style=\"padding:8px 22px 20px;font-size:12.5px;line-height:1.6;color:#aebdc8;text-wrap:pretty;\">{{ mapModal.caption }}<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <!-- legend -->\n  <div style=\"position:absolute;right:28px;bottom:150px;z-index:5;text-align:right;pointer-events:none;font-size:9px;letter-spacing:0.14em;color:#52677a;line-height:1.8;text-transform:uppercase;\">\n    <div style=\"display:flex;align-items:center;justify-content:flex-end;gap:7px;\"><span>Recorded toll<\u002Fspan><span style=\"width:7px;height:7px;border-radius:50%;background:#ff5a4f;box-shadow:0 0 6px #ff5a4f;\"><\u002Fspan><span style=\"width:13px;height:13px;border-radius:50%;background:#ff5a4f;box-shadow:0 0 10px #ff5a4f;\"><\u002Fspan><span style=\"margin-left:8px;\">Uncounted<\u002Fspan><span style=\"width:7px;height:7px;border-radius:50%;border:1px solid rgba(190,212,224,0.9);\"><\u002Fspan><span style=\"margin-left:8px;\">Naval<\u002Fspan><span style=\"width:9px;height:9px;border-radius:50%;border:1px solid rgba(86,207,225,0.95);\"><\u002Fspan><\u002Fdiv>\n    <div style=\"margin-top:5px;opacity:0.7;\">Dot size = estimated dead · figures are unreliable estimates<\u002Fdiv>\n    <div style=\"margin-top:3px;opacity:0.5;max-width:320px;margin-left:auto;text-transform:none;letter-spacing:0.02em;font-size:8.5px;line-height:1.5;\">Plotted only where written casualty records survive. Much of the world — the Americas, sub-Saharan Africa, Japan, the Pacific — fought wars no scribe ever counted. Empty ground is missing records, not peace.<\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- tooltip -->\n  <div ref=\"{{ tipRef }}\" style=\"position:absolute;left:0;top:0;z-index:8;pointer-events:none;opacity:0;transition:opacity 0.12s;will-change:transform;\">\n    <sc-if value=\"{{ hovered }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"transform:translate(-50%,-100%);margin-top:-14px;background:rgba(6,13,20,0.92);border:1px solid rgba(86,207,225,0.28);border-radius:8px;padding:8px 11px;white-space:nowrap;backdrop-filter:blur(6px);\">\n        <div style=\"font-family:'Cormorant Garamond',serif;font-size:16px;font-weight:600;color:#f2e7df;line-height:1.1;\">{{ hovered.name }}<\u002Fdiv>\n        <div style=\"display:flex;gap:12px;margin-top:5px;font-size:10px;letter-spacing:0.06em;\">\n          <span style=\"color:#56cfe1;\">{{ hovered.dateLabel }}<\u002Fspan>\n          <span style=\"color:#ff5a4f;\">{{ hovered.deathsFmt }} dead<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"font-size:9px;letter-spacing:0.14em;color:#6b8092;text-transform:uppercase;margin-top:3px;\">{{ hovered.eraLabel }}<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n  <\u002Fdiv>\n\n  <!-- bottom timeline -->\n  <div style=\"position:absolute;left:28px;right:28px;bottom:24px;z-index:6;background:rgba(7,15,23,0.72);border:1px solid rgba(86,207,225,0.14);border-radius:12px;padding:14px 18px 12px;backdrop-filter:blur(10px);display:flex;align-items:center;gap:18px;\">\n\n    <div style=\"display:flex;align-items:center;gap:8px;\">\n      <div onclick=\"{{ onRestart }}\" title=\"Restart\" style=\"cursor:pointer;width:34px;height:34px;border-radius:8px;border:1px solid rgba(255,255,255,0.1);display:flex;align-items:center;justify-content:center;color:#9fb3c2;font-size:13px;\">⏮<\u002Fdiv>\n      <div onclick=\"{{ onTogglePlay }}\" title=\"Play\" style=\"{{ playBtnStyle }}\">{{ playGlyph }}<\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"flex:1;position:relative;\">\n      <!-- era labels -->\n      <div style=\"position:relative;height:14px;margin-bottom:7px;\">\n        <sc-for list=\"{{ eraMarks }}\" as=\"m\" hint-placeholder-count=\"7\">\n          <div style=\"position:absolute;top:0;text-align:center;overflow:hidden;white-space:nowrap;font-size:8.5px;letter-spacing:0.12em;color:{{ m.color }};text-transform:uppercase;left:{{ m.left }}%;width:{{ m.width }}%;\">{{ m.label }}<\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n      <!-- track -->\n      <div onpointerdown=\"{{ onTrackDown }}\" ref=\"{{ trackRef }}\" style=\"position:relative;height:30px;cursor:pointer;border-radius:5px;background:linear-gradient(90deg, rgba(86,207,225,0.05), rgba(255,90,79,0.07));border:1px solid rgba(255,255,255,0.06);overflow:hidden;\">\n        <sc-for list=\"{{ eraDivs }}\" as=\"d\" hint-placeholder-count=\"6\">\n          <div style=\"position:absolute;top:0;bottom:0;width:1px;background:rgba(255,255,255,0.07);left:{{ d.left }}%;\"><\u002Fdiv>\n        <\u002Fsc-for>\n        <sc-for list=\"{{ ticks }}\" as=\"t\" hint-placeholder-count=\"20\">\n          <div style=\"position:absolute;bottom:4px;width:2px;border-radius:1px;background:{{ t.color }};left:{{ t.left }}%;height:{{ t.h }}px;\"><\u002Fdiv>\n        <\u002Fsc-for>\n        <div ref=\"{{ playheadRef }}\" style=\"position:absolute;top:-3px;bottom:-3px;width:2px;background:#56cfe1;box-shadow:0 0 10px #56cfe1;left:0%;\">\n          <div style=\"position:absolute;top:-4px;left:-3px;width:8px;height:8px;border-radius:50%;background:#56cfe1;box-shadow:0 0 10px #56cfe1;\"><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <!-- axis -->\n      <div style=\"position:relative;height:12px;margin-top:5px;\">\n        <sc-for list=\"{{ axisMarks }}\" as=\"a\" hint-placeholder-count=\"6\">\n          <div style=\"position:absolute;top:0;transform:translateX(-50%);font-size:8.5px;letter-spacing:0.08em;color:#52677a;left:{{ a.left }}%;\">{{ a.label }}<\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"display:flex;align-items:center;gap:6px;\">\n      <div onclick=\"{{ onZoomOut }}\" style=\"cursor:pointer;width:30px;height:30px;border-radius:7px;border:1px solid rgba(255,255,255,0.1);display:flex;align-items:center;justify-content:center;color:#9fb3c2;font-size:16px;\">−<\u002Fdiv>\n      <div onclick=\"{{ onZoomIn }}\" style=\"cursor:pointer;width:30px;height:30px;border-radius:7px;border:1px solid rgba(255,255,255,0.1);display:flex;align-items:center;justify-content:center;color:#9fb3c2;font-size:15px;\">+<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\nclass Component extends DCLogic {\n  constructor(props){\n    super(props);\n    this.state = { playing:false, hoveredId:null, pinnedId:null, activeEra:0, mapKey:null };\n    this.canvasRef = React.createRef();\n    this.tollRef = React.createRef();\n    this.yearRef = React.createRef();\n    this.railRef = React.createRef();\n    this.tipRef = React.createRef();\n    this.trackRef = React.createRef();\n    this.playheadRef = React.createRef();\n    this.statRef = React.createRef();\n    this.mapCanvasRef = React.createRef();\n\n    this.D2R = Math.PI/180;\n    this.YMIN = -401; this.YMAX = 100; this.SPAN = this.YMAX - this.YMIN;\n    this.year = this.YMIN;\n    this.displayToll = 0;\n    this.zoom = 1.05;\n    this.rotLng = -31;   // d3 rotation lambda (deg); centre lng = -rotLng\n    this.rotLat = -38;   // d3 rotation phi (deg);   centre lat = -rotLat\n    this.targetLng = this.rotLng;\n    this.targetLat = this.rotLat;\n    this.spinSpeed = -0.06;\n    this.dragging = false; this.tlDragging = false;\n    this.last = {x:0,y:0};\n    this.downInfo = {x:0,y:0,moved:false,battle:null};\n    this.lastInteract = (typeof performance!=='undefined'?performance.now():0);\n    this.proj = {};\n    this.appeared = {};\n\n    this.eras = [\n      {key:'alex',  title:'Greece & Alexander',   start:-401,end:-323, focusLng:31, focusLat:38, color:'#7fd6e8',\n        blurb:\"The long quarrels of the Greek cities give way to Macedon. In a single decade Alexander breaks the Persian Empire from the Granicus to the Indus.\"},\n      {key:'succ',  title:'Successors & Pyrrhus',  start:-323,end:-265, focusLng:20, focusLat:39, color:'#8fd1da',\n        blurb:\"Alexander's generals carve his empire apart at Ipsus, while Pyrrhus bleeds Rome white for victories he cannot afford.\"},\n      {key:'punic', title:'The Punic Wars',        start:-265,end:-146, focusLng:12, focusLat:39, color:'#a9c4cf',\n        blurb:\"Rome and Carthage fight for the western sea. Hannibal annihilates legions at Cannae; a century later Carthage itself is razed to ash.\"},\n      {key:'asc',   title:'Republic Ascendant',    start:-146,end:-100, focusLng:1,  focusLat:43, color:'#c4b4ac',\n        blurb:\"Victorious abroad, Rome turns to Spain and braces against the Cimbri and Teutones, whose migration nearly ends the Republic at Arausio.\"},\n      {key:'fall',  title:'Fall of the Republic',  start:-100,end:-44,  focusLng:9,  focusLat:43, color:'#d99b8e',\n        blurb:\"Slave armies, Gallic sieges, and disaster in the Parthian desert. Caesar conquers Gaul, then crosses the Rubicon to fight Rome itself.\"},\n      {key:'heirs', title:'Heirs of Caesar',       start:-44, end:-27,  focusLng:23, focusLat:38, color:'#e88f80',\n        blurb:\"Caesar's assassins fall at Philippi; the last war of the Republic ends in the sea off Actium. One man remains.\"},\n      {key:'empire',title:'The Early Empire',      start:-27, end:100,  focusLng:9,  focusLat:46, color:'#ff5a4f',\n        blurb:\"Under the emperors the frontiers harden. Three legions vanish in Teutoburg's forest, Britain burns under Boudica, and Jerusalem is destroyed.\"},\n    ];\n\n    this.battles = [];   // loaded from battles.js in componentDidMount\n\n    this.regions = [\n      {n:'GALLIA',lat:47,lng:3},{n:'HISPANIA',lat:40,lng:-4},{n:'ITALIA',lat:42.5,lng:13},\n      {n:'GRAECIA',lat:39,lng:22.5},{n:'AFRICA',lat:33,lng:9},{n:'ASIA',lat:39,lng:31},\n      {n:'AEGYPTVS',lat:27,lng:30},{n:'IVDAEA',lat:31.5,lng:36},{n:'BRITANNIA',lat:53,lng:-2},\n      {n:'GERMANIA',lat:52,lng:11},{n:'PERSIS',lat:31,lng:53},\n      {n:'INDIA',lat:22,lng:79},{n:'SINAE',lat:34,lng:110},{n:'SCYTHIA',lat:50,lng:72},\n    ];\n\n    // regions whose ancient wars left no usable written record\n    this.undocRegions = [\n      {name:'THE AMERICAS', sub:'no surviving battle records', labelAt:[-74,16],\n        rings:[[[-165,66],[-120,68],[-80,52],[-58,48],[-78,16],[-90,8],[-118,30],[-140,40]],\n               [[-79,10],[-60,8],[-35,3],[-37,-25],[-50,-50],[-70,-52],[-78,-30],[-82,-6]]]},\n      {name:'SUB-SAHARAN AFRICA', sub:'almost no surviving records', labelAt:[23,-7],\n        rings:[[[-17,13],[10,14],[35,11],[44,2],[40,-18],[26,-34],[16,-35],[8,-30],[-12,8]]]},\n      {name:'AUSTRALIA & OCEANIA', sub:'no surviving records', labelAt:[134,-25],\n        rings:[[[113,-11],[131,-12],[154,-13],[151,-39],[136,-39],[116,-35]]]},\n      {name:'JAPAN & THE FAR ISLES', sub:'no surviving records', labelAt:[140,40],\n        rings:[[[129,30],[136,33],[143,35],[146,46],[140,46],[131,38],[130,33]]]},\n    ];\n\n    ['loop','draw','onWinMove','onUp','resize','onCanvasDown','onWheel','onTrackDown','onTogglePlay','onRestart','onZoomIn','onZoomOut','onClearPin','onOpenMap','onCloseMap'].forEach(m=>{ this[m]=this[m].bind(this); });\n  }\n\n  clamp(v,a,b){ return Math.max(a,Math.min(b,v)); }\n  fmtYear(y){ y=Math.round(y); if(y<0) return Math.abs(y)+' BCE'; return (y===0?1:y)+' CE'; }\n  eraIndexFor(y){ for(let i=0;i<this.eras.length;i++){ if(y<this.eras[i].end) return i; } return this.eras.length-1; }\n  latestBattle(){ let best=null; for(const b of this.battles){ if(b.year<=this.year && (!best||b.year>best.year)) best=b; } return best; }\n\n  componentDidMount(){\n    const cv=this.canvasRef.current; if(!cv) return;\n    this._ctx=cv.getContext('2d');\n    this.resize();\n    this._initGeo();\n    this._onResize=()=>this.resize(); window.addEventListener('resize',this._onResize);\n    if(window.ResizeObserver){ this._ro=new ResizeObserver(()=>this.resize()); this._ro.observe(cv); }\n    window.addEventListener('pointermove',this.onWinMove);\n    window.addEventListener('pointerup',this.onUp);\n    this.selectEra(0,true);\n    this._raf=requestAnimationFrame(this.loop);\n    this.draw();\n    setTimeout(()=>this._loadBattles(),0);\n  }\n  componentWillUnmount(){\n    cancelAnimationFrame(this._raf);\n    if(this._ro){ this._ro.disconnect(); this._ro=null; }\n    window.removeEventListener('resize',this._onResize);\n    window.removeEventListener('pointermove',this.onWinMove);\n    window.removeEventListener('pointerup',this.onUp);\n  }\n  _initGeo(){\n    const tryInit=()=>{\n      if(window.d3 && window.topojson){\n        this.projection=d3.geoOrthographic().clipAngle(90).precision(0.4);\n        this.geoPath=d3.geoPath(this.projection, this._ctx);\n        this._grat=d3.geoGraticule10();\n        this.draw();\n        fetch('https://cdn.jsdelivr.net/npm/world-atlas@2/land-110m.json')\n          .then(r=>r.json())\n          .then(t=>{ this.land=topojson.feature(t,t.objects.land); this.draw(); })\n          .catch(()=>{});\n      } else {\n        this._geoTries=(this._geoTries||0)+1;\n        if(this._geoTries<150) setTimeout(tryInit,60);\n        else console.warn('d3/topojson failed to load');\n      }\n    };\n    tryInit();\n  }\n  _loadBattles(){\n    const apply=()=>{\n      const raw=window.BATTLES;\n      if(raw && raw.length){\n        this.battles=raw.map((b,i)=>({\n          id:i, name:b.n, year:b.y, lat:b.lat, lng:b.lng, deaths:b.d,\n          dateLabel:this.fmtYear(b.y),\n          deathsFmt:(b.d==null?'Not recorded':b.d.toLocaleString('en-US')),\n          era:this.eraIndexFor(b.y),\n        }));\n        const navalKeys=['Cnidus','Mylae','Cape Ecnomus','Aegates','Drepana','Phintias','Actium','Naulochus','Arginusae','Aegospotami','Cynossema','Notion','Battle of Cos','Lade','Chios','Andros','Tyndaris','Lipari','Ephesus','Sulci','Eurymedon','Myonessus','Tenedos','Chalcedon','Korakesion','Tauroento','Tauris','Paxos','Echinades','Amorgos','Pharos','Strait of Messina','Port of Carthage','Cape Hermaeum','Ebro','Carteia','Morbihan','Ionian Sea','Lemnos','Salamis','Naxos'];\n        this.battles.forEach(b=>{ b.naval=navalKeys.some(k=>b.name.indexOf(k)>=0); b.hasMap=!!(window.BATTLE_MAPS&&window.BATTLE_MAPS[b.name]); b.eraLabel=(b.naval?'Naval \\u00b7 ':'')+this.eras[b.era].title; });\n        this.forceUpdate();\n        this.draw();\n      } else {\n        this._batTries=(this._batTries||0)+1;\n        if(this._batTries<200) setTimeout(apply,50);\n        else console.warn('battles.js failed to load');\n      }\n    };\n    apply();\n  }\n\n  resize(){\n    const cv=this.canvasRef.current; if(!cv) return;\n    const r=cv.getBoundingClientRect();\n    if(r.width<2 || r.height<2){   // no layout yet; retry (setTimeout fires even when hidden)\n      if(!this._sizeRetry){ this._sizeRetry=setTimeout(()=>{ this._sizeRetry=0; this.resize(); },60); }\n      return;\n    }\n    const dpr=Math.min(2,window.devicePixelRatio||1);\n    const nw=Math.max(2,Math.round(r.width*dpr)), nh=Math.max(2,Math.round(r.height*dpr));\n    if(cv.width!==nw) cv.width=nw;\n    if(cv.height!==nh) cv.height=nh;\n    this._w=r.width; this._h=r.height;\n    this._ctx.setTransform(dpr,0,0,dpr,0,0);\n    this.draw();\n  }\n\n  project(lat,lng){\n    const proj=this.projection;\n    if(!proj) return {x:this._cx,y:this._cy,z:0,vis:false};\n    const xy=proj([lng,lat]);\n    const dist=d3.geoDistance([lng,lat], this._center||[-this.rotLng,-this.rotLat]);\n    const front=dist<Math.PI/2;\n    return {x:xy?xy[0]:this._cx, y:xy?xy[1]:this._cy, z:Math.max(0,Math.cos(dist)), vis:front && !!xy};\n  }\n\n  loop(t){\n    const now=performance.now();\n    const dt=Math.min(0.05,(now-(this._lt||now))/1000); this._lt=now;\n    if(this.state.playing){\n      this.year+=dt*23;\n      if(this.year>=this.YMAX){ this.year=this.YMAX; this.setState({playing:false}); }\n    }\n    if(!this.dragging && !this.tlDragging){\n      const idle = now-this.lastInteract>2200;\n      if(this.state.playing || idle){ this.targetLng+=this.spinSpeed; }\n    }\n    this.rotLng+=(this.targetLng-this.rotLng)*0.07;\n    this.rotLat+=(this.targetLat-this.rotLat)*0.07;\n\n    if(this.state.playing||this.tlDragging){\n      const ae=this.eraIndexFor(this.year);\n      if(ae!==this.state.activeEra) this.setState({activeEra:ae},()=>this.scrollRail(ae));\n    }\n    try{ this.draw(); }catch(e){}\n    this._raf=requestAnimationFrame(this.loop);\n  }\n\n  draw(){\n    const ctx=this._ctx; if(!ctx) return;\n    const w=this._w,h=this._h;\n    if(!w || !h || w<2 || h<2) return;   // canvas not laid out yet\n    ctx.clearRect(0,0,w,h);\n    const cx=w*0.55, cy=h*0.5;\n    const R=Math.min(w,h)*0.42*this.zoom;\n    this._cx=cx; this._cy=cy; this._R=R;\n    const proj=this.projection;\n    if(proj){ proj.rotate([this.rotLng,this.rotLat]).scale(R).translate([cx,cy]); this._center=[-this.rotLng,-this.rotLat]; }\n\n    // atmosphere glow\n    let ag=ctx.createRadialGradient(cx,cy,R*0.82,cx,cy,R*1.42);\n    ag.addColorStop(0,'rgba(86,207,225,0.0)');\n    ag.addColorStop(0.62,'rgba(86,207,225,0.22)');\n    ag.addColorStop(0.82,'rgba(86,207,225,0.07)');\n    ag.addColorStop(1,'rgba(86,207,225,0.0)');\n    ctx.fillStyle=ag; ctx.beginPath(); ctx.arc(cx,cy,R*1.42,0,Math.PI*2); ctx.fill();\n\n    // ocean sphere\n    let dg=ctx.createRadialGradient(cx-R*0.34,cy-R*0.36,R*0.05,cx,cy,R);\n    dg.addColorStop(0,'#10303f');\n    dg.addColorStop(0.5,'#0b2331');\n    dg.addColorStop(0.82,'#081a26');\n    dg.addColorStop(1,'#06131c');\n    ctx.fillStyle=dg; ctx.beginPath(); ctx.arc(cx,cy,R,0,Math.PI*2); ctx.fill();\n\n    if(proj && this.geoPath){\n      ctx.save();\n      ctx.beginPath(); ctx.arc(cx,cy,R,0,Math.PI*2); ctx.clip();\n      // graticule\n      if(this._grat){ ctx.beginPath(); this.geoPath(this._grat); ctx.lineWidth=0.6; ctx.strokeStyle='rgba(125,200,225,0.12)'; ctx.stroke(); }\n      // land\n      if(this.land){\n        ctx.beginPath(); this.geoPath(this.land);\n        let lg=ctx.createRadialGradient(cx-R*0.34,cy-R*0.36,R*0.05,cx,cy,R);\n        lg.addColorStop(0,'rgba(96,150,168,0.58)');\n        lg.addColorStop(1,'rgba(44,92,110,0.42)');\n        ctx.fillStyle=lg; ctx.fill();\n        ctx.lineWidth=0.8; ctx.strokeStyle='rgba(155,225,242,0.5)'; ctx.stroke();\n      }\n      // undocumented-warfare regions (faint shading)\n      if(this.undocRegions){\n        for(const u of this.undocRegions){\n          ctx.beginPath();\n          for(const ring of u.rings){ this.geoPath({type:'Polygon',coordinates:[ring]}); }\n          ctx.fillStyle='rgba(150,118,104,0.13)'; ctx.fill();\n          ctx.lineWidth=0.8; ctx.setLineDash([4,4]); ctx.strokeStyle='rgba(205,150,128,0.34)'; ctx.stroke(); ctx.setLineDash([]);\n        }\n      }\n      ctx.restore();\n    }\n    // limb\n    ctx.lineWidth=1.4; ctx.strokeStyle='rgba(150,215,235,0.6)';\n    ctx.shadowColor='rgba(86,207,225,0.55)'; ctx.shadowBlur=16;\n    ctx.beginPath(); ctx.arc(cx,cy,R,0,Math.PI*2); ctx.stroke();\n    ctx.shadowBlur=0;\n\n    // region labels\n    ctx.textAlign='center'; ctx.textBaseline='middle';\n    ctx.font='600 10px \"IBM Plex Mono\", monospace';\n    for(const rg of this.regions){\n      const p=this.project(rg.lat,rg.lng); if(!p.vis||p.z<0.28) continue;\n      ctx.globalAlpha=0.10+0.30*p.z; ctx.fillStyle='#9fc3d2';\n      ctx.fillText(rg.n.split('').join('\\u2009'),p.x,p.y);\n    }\n    ctx.globalAlpha=1;\n\n    // undocumented-region labels\n    for(const u of this.undocRegions){\n      const p=this.project(u.labelAt[1],u.labelAt[0]); if(!p.vis||p.z<0.32) continue;\n      ctx.globalAlpha=0.45+0.45*p.z;\n      ctx.fillStyle='rgba(214,158,138,0.95)'; ctx.font='600 10px \"IBM Plex Mono\", monospace';\n      ctx.fillText(u.name, p.x, p.y);\n      ctx.fillStyle='rgba(196,150,134,0.8)'; ctx.font='8px \"IBM Plex Mono\", monospace';\n      ctx.fillText(u.sub, p.x, p.y+12);\n    }\n    ctx.globalAlpha=1;\n\n    // markers\n    const now=performance.now();\n    this.proj={};\n    let fought=0, counted=0, tollTarget=0;\n    const vis=[];\n    for(const b of this.battles){\n      if(b.year<=this.year){\n        fought++; if(b.deaths!=null){ counted++; tollTarget+=b.deaths; }\n        if(!this.appeared[b.id]) this.appeared[b.id]=now;\n      } else { if(this.appeared[b.id]) delete this.appeared[b.id]; continue; }\n      const p=this.project(b.lat,b.lng);\n      this.proj[b.id]={x:p.x,y:p.y,vis:p.vis};\n      if(p.vis) vis.push({b,p});\n    }\n    vis.sort((a,c)=>a.p.z-c.p.z);\n    for(const {b,p} of vis){\n      const isHover=this.state.hoveredId===b.id;\n      const isPin=this.state.pinnedId===b.id;\n      if(b.deaths!=null){\n        const baseR=this.clamp(2.6+Math.sqrt(b.deaths)/42,2.6,15);\n        const a=0.55+0.45*p.z;\n        const ap=this.appeared[b.id]; if(ap){ const age=(now-ap)/1000; if(age<1.7){ const pr=baseR+age*46; ctx.globalAlpha=(1-age/1.7)*0.5; ctx.strokeStyle='#ff5a4f'; ctx.lineWidth=1.4; ctx.beginPath(); ctx.arc(p.x,p.y,pr,0,Math.PI*2); ctx.stroke(); } }\n        ctx.globalAlpha=a;\n        ctx.shadowColor='rgba(255,90,79,0.9)'; ctx.shadowBlur=baseR*1.7;\n        ctx.fillStyle='rgba(255,90,79,0.88)'; ctx.beginPath(); ctx.arc(p.x,p.y,baseR,0,Math.PI*2); ctx.fill();\n        ctx.shadowBlur=0;\n        ctx.globalAlpha=Math.min(1,a+0.2);\n        ctx.fillStyle='#ffd9c2'; ctx.beginPath(); ctx.arc(p.x,p.y,Math.max(1,baseR*0.34),0,Math.PI*2); ctx.fill();\n        if(b.naval){ ctx.globalAlpha=Math.min(1,a+0.15); ctx.strokeStyle='rgba(86,207,225,0.85)'; ctx.lineWidth=1.1; ctx.beginPath(); ctx.arc(p.x,p.y,baseR+2.6,0,Math.PI*2); ctx.stroke(); }\n        if(isHover){ ctx.globalAlpha=1; ctx.strokeStyle='#ffffff'; ctx.lineWidth=1.4; ctx.beginPath(); ctx.arc(p.x,p.y,baseR+4,0,Math.PI*2); ctx.stroke(); }\n        if(isPin){ ctx.globalAlpha=1; ctx.strokeStyle='#56cfe1'; ctx.lineWidth=1.6; ctx.beginPath(); ctx.arc(p.x,p.y,baseR+6,0,Math.PI*2); ctx.stroke(); }\n      } else {\n        const rr=isHover?4.4:3.1;\n        ctx.globalAlpha=(isHover||isPin)?1:(0.30+0.32*p.z);\n        ctx.strokeStyle=isPin?'#56cfe1':(isHover?'#ffffff':(b.naval?'rgba(86,207,225,0.9)':'rgba(188,210,222,0.85)'));\n        ctx.lineWidth=1.2; ctx.beginPath(); ctx.arc(p.x,p.y,rr,0,Math.PI*2); ctx.stroke();\n      }\n      ctx.globalAlpha=1;\n    }\n    ctx.globalAlpha=1;\n\n    // overlays\n    const target=tollTarget;\n    this.displayToll+=(target-this.displayToll)*0.14;\n    if(Math.abs(target-this.displayToll)<2) this.displayToll=target;\n    if(this.tollRef.current) this.tollRef.current.textContent=Math.round(this.displayToll).toLocaleString('en-US');\n    if(this.yearRef.current) this.yearRef.current.textContent=this.fmtYear(this.year);\n    if(this.statRef.current) this.statRef.current.textContent=fought+' battles  ·  '+counted+' counted  ·  '+(fought-counted)+' uncounted';\n    if(this.playheadRef.current) this.playheadRef.current.style.left=((this.year-this.YMIN)/this.SPAN*100)+'%';\n\n    const hv=this.state.hoveredId, tip=this.tipRef.current;\n    if(tip){ const pp=hv!=null?this.proj[hv]:null; if(pp&&pp.vis){ tip.style.opacity=1; tip.style.transform=`translate(${pp.x}px, ${pp.y}px)`; } else tip.style.opacity=0; }\n\n    if(cv=this.canvasRef.current) cv.style.cursor=this.dragging?'grabbing':(this.state.hoveredId!=null?'pointer':'grab');\n    var cv;\n  }\n\n  hitTest(mx,my){ let best=null,bd=15; for(const id in this.proj){ const p=this.proj[id]; if(!p.vis) continue; const d=Math.hypot(p.x-mx,p.y-my); if(d<bd){bd=d;best=+id;} } return best; }\n\n  onCanvasDown(e){\n    this.dragging=true; this.last={x:e.clientX,y:e.clientY};\n    this.downInfo={x:e.clientX,y:e.clientY,moved:false,battle:this.state.hoveredId};\n    this.lastInteract=performance.now();\n  }\n  onWinMove(e){\n    if(this.tlDragging){ this.setYearFromX(e.clientX); return; }\n    const cv=this.canvasRef.current; if(!cv) return;\n    const r=cv.getBoundingClientRect();\n    const mx=e.clientX-r.left, my=e.clientY-r.top;\n    if(this.dragging){\n      const dx=e.clientX-this.last.x, dy=e.clientY-this.last.y; this.last={x:e.clientX,y:e.clientY};\n      if(Math.abs(e.clientX-this.downInfo.x)+Math.abs(e.clientY-this.downInfo.y)>4) this.downInfo.moved=true;\n      this.rotLng+=dx*0.32; this.rotLat=this.clamp(this.rotLat-dy*0.32,-85,85);\n      this.targetLng=this.rotLng; this.targetLat=this.rotLat; this.lastInteract=performance.now();\n      if(this.state.hoveredId!=null) this.setState({hoveredId:null});\n    } else {\n      if(mx>=0&&my>=0&&mx<=r.width&&my<=r.height){ const id=this.hitTest(mx,my); if(id!==this.state.hoveredId) this.setState({hoveredId:id}); }\n      else if(this.state.hoveredId!=null) this.setState({hoveredId:null});\n    }\n  }\n  onUp(e){\n    if(this.tlDragging) this.tlDragging=false;\n    if(this.dragging){\n      this.dragging=false;\n      if(!this.downInfo.moved){\n        const id=this.downInfo.battle;\n        if(id!=null) this.pinBattle(id);\n        else if(this.state.pinnedId!=null) this.setState({pinnedId:null});\n      }\n    }\n  }\n  onWheel(e){ this.zoom=this.clamp(this.zoom*(1-e.deltaY*0.0012),0.7,3.6); this.lastInteract=performance.now(); }\n\n  pinBattle(id){\n    const b=this.battles[id];\n    this.setState({pinnedId:id});\n    this.targetLng=-b.lng; this.targetLat=this.clamp(-b.lat,-85,85);\n    if(this.year<b.year) this.year=b.year;\n    this.lastInteract=performance.now();\n  }\n  selectEra(idx,silent){\n    const e=this.eras[idx];\n    this.year=e.end;\n    this.targetLng=-e.focusLng; this.targetLat=this.clamp(-e.focusLat,-85,85);\n    this.lastInteract=performance.now();\n    this.setState({activeEra:idx,playing:false});\n    if(!silent) this.scrollRail(idx);\n  }\n  scrollRail(idx){\n    const rail=this.railRef.current; if(!rail) return;\n    const el=rail.children[idx]; if(el) rail.scrollTo({top:Math.max(0,el.offsetTop-12),behavior:'smooth'});\n  }\n\n  onTogglePlay(){ const p=!this.state.playing; if(p&&this.year>=this.YMAX){ this.year=this.YMIN; this.displayToll=0; } this.setState({playing:p}); this.lastInteract=performance.now()-9999; }\n  onRestart(){ this.year=this.YMIN; this.displayToll=0; this.setState({playing:false}); this.selectEra(0); }\n  onZoomIn(){ this.zoom=this.clamp(this.zoom*1.25,0.7,3.6); this.lastInteract=performance.now(); }\n  onZoomOut(){ this.zoom=this.clamp(this.zoom/1.25,0.7,3.6); this.lastInteract=performance.now(); }\n  onClearPin(){ this.setState({pinnedId:null}); }\n  onOpenMap(name){ this.setState({mapKey:name}, ()=>this._drawMap()); }\n  onCloseMap(){ this.setState({mapKey:null}); }\n  _drawMap(){\n    const cv=this.mapCanvasRef.current; const map=window.BATTLE_MAPS&&window.BATTLE_MAPS[this.state.mapKey];\n    if(!cv||!map||!window.drawBattleMap) return;\n    const r=cv.getBoundingClientRect();\n    if(r.width<2||r.height<2){ setTimeout(()=>this._drawMap(),40); return; }\n    const dpr=Math.min(2,window.devicePixelRat onst axis=[{y:-400,l:'400 BCE'},{y:-300,l:'300'},{y:-200,l:'200'},{y:-100,l:'100'},{y:1,l:'1 CE'},{y:100,l:'100'}].map(o=>({left:pct(o.y),label:o.l}));\n\n    const hovered = st.hoveredId!=null ? this.battles[st.hoveredId] : null;\n    let pinned=null;\n    if(st.pinnedId!=null && this.battles[st.pinnedId]){\n      const b=this.battles[st.pinnedId];\n      pinned={ name:b.name, eraLabel:b.eraLabel, dateLabel:b.dateLabel, deathsFmt:b.deathsFmt,\n               uncounted:(b.deaths==null), deathsColor:(b.deaths==null?'#7d92a2':'#ff5a4f'),\n               hasMap:!!(window.BATTLE_MAPS && window.BATTLE_MAPS[b.name]), onMap:()=>this.onOpenMap(b.name) };\n    }\n\n    let mapModal=null;\n    if(st.mapKey && window.BATTLE_MAPS && window.BATTLE_MAPS[st.mapKey]){\n      const mp=window.BATTLE_MAPS[st.mapKey];\n      mapModal={ title:st.mapKey, dateLabel:this.fmtYear(mp.year), caption:mp.caption,\n        sides:mp.sides.map(s=>({name:s.name, swatch:`width:12px;height:12px;border-radius:3px;background:${s.color};flex:none;`})) };\n    }\n\n    const playing=st.playing;\n    return {\n      canvasRef:this.canvasRef, tollRef:this.tollRef, yearRef:this.yearRef,\n      railRef:this.railRef, tipRef:this.tipRef, trackRef:this.trackRef, playheadRef:this.playheadRef, statRef:this.statRef,\n      onCanvasDown:this.onCanvasDown, onWheel:this.onWheel, onTrackDown:this.onTrackDown,\n      onTogglePlay:this.onTogglePlay, onRestart:this.onRestart, onZoomIn:this.onZoomIn, onZoomOut:this.onZoomOut, onClearPin:this.onClearPin,\n      onCloseMap:this.onCloseMap, mapCanvasRef:this.mapCanvasRef, mapModal, stop:(e)=>e.stopPropagation(),\n      eras, ticks, eraMarks, eraDivs, axisMarks:axis,\n      hovered, pinned, playing,\n      playGlyph: playing?'\\u23F8':'\\u25B6',\n      playBtnStyle:`cursor:pointer;width:38px;height:38px;border-radius:9px;border:1px solid ${playing?'rgba(255,90,79,0.5)':'rgba(86,207,225,0.4)'};background:${playing?'rgba(255,90,79,0.12)':'rgba(86,207,225,0.10)'};display:flex;align-items:center;justify-content:center;color:${playing?'#ff8a7f':'#7fd6e8'};font-size:14px;`,\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
